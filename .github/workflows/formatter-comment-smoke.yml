name: Formatter comment alignment smoke

on:
  push:
    branches:
      - ci/formatter-comment-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatter-align-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Bazel and parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bison flex
          sudo wget -q https://github.com/bazelbuild/bazel/releases/download/7.6.1/bazel-7.6.1-linux-x86_64 -O /usr/local/bin/bazel
          sudo chmod +x /usr/local/bin/bazel
          bazel --version
      - name: Run formatter alignment regression
        shell: bash
        run: |
          set -euo pipefail
          bazel test -c fastbuild --test_output=errors //verible/verilog/formatting:formatter_align_test
      - name: Verify formatter CLI flag and stable output
        shell: bash
        run: |
          set -euo pipefail
          bazel build -c fastbuild //verible/verilog/tools/formatter:verible-verilog-format
          formatter=bazel-bin/verible/verilog/tools/formatter/verible-verilog-format
          cat > /tmp/input.sv <<'SV'
          module m;
          logic a; // first
          logic longer_name; // second
          endmodule
          SV
          cat > /tmp/expected.sv <<'SV'
          module m;
            logic a;            // first
            logic longer_name;  // second
          endmodule
          SV
          "$formatter" --module_net_variable_alignment=align --data_declaration_align_trailing_comments=true /tmp/input.sv > /tmp/actual.sv
          diff -u /tmp/expected.sv /tmp/actual.sv
          "$formatter" --module_net_variable_alignment=align --data_declaration_align_trailing_comments=true /tmp/actual.sv > /tmp/repeated.sv
          diff -u /tmp/actual.sv /tmp/repeated.sv
